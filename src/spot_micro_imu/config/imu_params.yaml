/**:
    ros__parameters:
      frame_id: "imu_link"
      i2c_address: 40      # 0x28 — BNO055 default; use 41 (0x29) if the ADR pin is pulled high
      update_rate_hz: 20.0
      # Body-frame mount correction (see spot_micro_imu/mount.py). Written by the IMU
      # zero (Deck: hold Y + D-pad down) and axis calibration (Y + D-pad left) — no need
      # to edit by hand. [1, 0, 0, 0] = the chip's axes are the robot's.
      mount_quaternion: [0.024783, 0.010159, -0.010855, -0.999582]
      yaw_offset_deg: -108.456
