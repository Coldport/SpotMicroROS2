# Mosquitto settings for the SpotMicro Steam Deck bridge.
# Installed to /etc/mosquitto/conf.d/spotmicro.conf by setup.sh.
#
# Mosquitto 2.x only listens on localhost unless a listener is configured.
# This opens port 1883 to the LAN so the Steam Deck can connect.
listener 1883

# WARNING: anyone on your network can read the camera/lidar/map streams and
# publish fake controller input while this is true. That's acceptable on a
# private home network while the robot can't move, but before the gait
# controller is driven from the Deck, require a password instead:
#   sudo mosquitto_passwd -c /etc/mosquitto/spotmicro.passwd deck
#   ...then replace the line below with:
#   allow_anonymous false
#   password_file /etc/mosquitto/spotmicro.passwd
# and set mqtt_username / mqtt_password in deck_params.yaml plus --user/--password
# on the Deck app.
allow_anonymous true
