/**:
    ros__parameters:
      # The Mosquitto broker runs on the robot, so the bridge talks to localhost.
      # The Steam Deck connects to the same broker over the network.
      mqtt_host: "localhost"
      mqtt_port: 1883
      # Leave empty unless you've enabled a password on the broker (see README).
      mqtt_username: ""
      mqtt_password: ""
      topic_prefix: "spotmicro"

      # Color stream of each camera; the bridge follows whichever one is running
      # (spot_micro_camera's camera.launch.py starts the one that is plugged in).
      color_topic: "/spotmicro_cam/d405/color/image_raw/compressed"
      usb_color_topic: "/spotmicro_cam/usb/image_raw/compressed"
      depth_topic: "/spotmicro_cam/d405/depth/image_rect_raw"
      # Stop the camera while the Deck shows the map view (unless track_node or
      # another viewer still subscribes to it); it starts again on leaving the view.
      camera_off_in_map: true
      usb_capture_service: "/spotmicro_cam/set_capture"
      realsense_node: "/spotmicro_cam/d405"
      scan_topic: "/scan"
      map_topic: "/map"
      imu_topic: "/spotmicro_imu/imu/data"
      map_frame: "map"
      base_frame: "base_link"
      # The Deck's settings menu reads/writes this node's live parameters, and
      # shows its armed state.
      gait_node: "/gait_node"
      armed_topic: "/spotmicro_move/armed"

      jpeg_quality: 75
      video_max_fps: 15.0
      scan_rate_hz: 10.0
      state_rate_hz: 5.0
      # Depth view colour range: near = warm, far = cool, no reading = black.
      depth_min_m: 0.1
      depth_max_m: 2.5
      # Publish an all-zero Joy if the Deck is connected but silent this long.
      input_timeout_s: 0.5
      # Robot mic -> Deck (the Anker webcam's mic). Needs the bridge's user in
      # the "audio" group (systemd/spotmicro-deck.service adds it).
      audio_enabled: false
      audio_gain_db: 0.0
      audio_device: "auto"       # or part of a card name ("C200"), or "plughw:0,0"
      audio_rate: 16000          # Hz; 1 byte/sample on the wire (mu-law)
